<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Router · 进 core 与出 core · 动画讲解</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --ink:#16181d; --dim:#5c6370; --line:#d8dce3;
  --accent:#2563eb; --warn:#d97706; --ok:#0d9488; --bad:#dc2626; --violet:#7c3aed;
  --box:#f8fafc; --boxb:#374151; --hi:#dbeafe; --hib:#2563eb;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161a; --panel:#1b1e24; --ink:#e6e8ec; --dim:#9aa1ad; --line:#2c313a;
        --box:#22262e; --boxb:#5b6472; --hi:#1e3a5f; --hib:#60a5fa; --accent:#60a5fa;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;
     display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);
       display:flex;align-items:center;gap:9px 18px;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
h1 small{font-weight:400;color:var(--dim);font-size:12px;margin-left:8px}
nav{display:flex;gap:4px;flex-wrap:wrap;flex-basis:100%}   /* 场景按钮固定独占一行，不随窗口宽度上下跳 */
nav button{font-family:var(--sans);font-size:12.5px;padding:5px 12px;border:1px solid var(--line);
  background:transparent;color:var(--dim);border-radius:999px;cursor:pointer;transition:.15s}
nav button:hover{color:var(--ink);border-color:var(--boxb)}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
main{flex:1;display:flex;min-height:0}
#stagewrap{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 14px 0}
#stage{flex:1;min-height:0}
#stage svg{width:100%;height:100%;display:block}
aside{width:560px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);
      padding:14px 16px 24px;overflow-y:auto}
h3.sec{font-size:11px;margin:14px 0 5px;color:var(--dim);font-weight:600;letter-spacing:.06em}
#stepno{font-family:var(--mono);font-size:11px;color:var(--dim)}
#steptitle{font-size:15.5px;font-weight:700;margin:2px 0 8px;line-height:1.4}
#steptext{font-size:13.5px}
#steptext ol{margin:6px 0 0;padding-left:22px}
#steptext li{margin:6px 0;line-height:1.65}
#steptext li::marker{color:var(--dim);font-family:var(--mono);font-size:12px}
#steptext code{font-family:var(--mono);font-size:12.5px;background:var(--box);
  padding:1px 4px;border-radius:3px}
#steplogic pre{margin:0;font-family:var(--mono);font-size:11px;line-height:1.8;
  background:var(--box);border:1px solid var(--line);border-radius:5px;padding:9px 11px;
  white-space:pre;overflow-x:auto;color:var(--ink)}
table.lg{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;
  background:var(--box);border:1px solid var(--line);border-radius:5px;overflow:hidden}
table.lg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 9px 4px;
  border-bottom:1px solid var(--line);white-space:nowrap}
table.lg td{padding:5px 9px;border-top:1px solid var(--line);
  vertical-align:top;line-height:1.6;color:var(--ink)}
table.lg tr.cont td{border-top:none;padding-top:0}
table.lg tr.cont td:first-child,table.lg tr.cont td:nth-child(2){padding:0}
table.lg td.d{width:36%;font-weight:600}
table.lg td.c{width:19%;color:var(--acc)}
#stepref{margin-top:12px;font-size:11.5px;color:var(--dim);border-left:2px solid var(--warn);
  padding-left:9px;line-height:1.55}
#stepref b{color:var(--warn)}
table.st{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
table.st th{text-align:left;color:var(--dim);font-weight:600;padding:2px 5px 4px;border-bottom:1px solid var(--line)}
table.st td{padding:2px 5px;border-bottom:1px solid var(--line)}
table.st tr.chg td{background:var(--hi);color:var(--hib);font-weight:700}
footer{border-top:1px solid var(--line);background:var(--panel);padding:8px 18px;
       display:flex;align-items:center;gap:12px;flex-wrap:wrap}
footer button{font-family:var(--sans);font-size:13px;padding:5px 13px;border:1px solid var(--line);
  background:var(--box);color:var(--ink);border-radius:6px;cursor:pointer}
footer button:hover{border-color:var(--accent)}
footer button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;min-width:74px}
#bar{flex:1;min-width:120px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;cursor:pointer}
#barfill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .12s linear}
#kbd{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
label.spd{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px}
label.spd input{width:76px}
.nd rect{fill:var(--box);stroke:var(--boxb);stroke-width:1}
.nd text{fill:var(--ink);font-family:var(--sans)}
.nd.act rect{fill:var(--hi);stroke:var(--hib);stroke-width:2}
.nd.act text.t{fill:var(--hib);font-weight:700}
.nd.blk rect{fill:#fee2e2;stroke:var(--bad);stroke-width:2}
@media (prefers-color-scheme:dark){.nd.blk rect{fill:#3f1d1d}}
.nd.blk text.t{fill:var(--bad);font-weight:700}
.sub{fill:var(--dim);font-size:9.5px}
.grp{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 3}
.grpl{fill:var(--dim);font-size:10px;letter-spacing:.06em}
.ed{fill:none;stroke:var(--boxb);stroke-width:1.1;opacity:.55}
.ed.act{stroke:var(--accent);stroke-width:2;opacity:1}
.edl{fill:var(--dim);font-size:9px;font-family:var(--mono)}
.tok{stroke:none}
.cnt{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:10.5px;fill:var(--dim)}
.cnt.chg{fill:var(--hib);font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Router · 进 core 与出 core<small>两条完全并行的通路 · 另有 reduce / broadcast / reissue / bypass 四份</small></h1>
  <nav id="nav"></nav>
</header>
<main>
  <div id="stagewrap"><div id="stage"></div></div>
  <aside>
    <div id="stepno"></div>
    <div id="steptitle"></div>
    <div id="steptext"></div>
    <div id="steplogic"></div>
    <div id="stepref"></div>
    <div id="statepanel"><h3 class="sec" id="stlabel">状态</h3><div id="sttable"></div></div>
  </aside>
</main>
<footer>
  <button class="pri" id="play">▶ 播放</button>
  <button id="prev">‹ 上一步</button>
  <button id="next">下一步 ›</button>
  <div id="bar"><div id="barfill"></div></div>
  <label class="spd">速度 <input type="range" id="spd" min="500" max="4000" step="250" value="1500"></label>
  <span id="kbd">空格 播放/暂停　← → 单步</span>
</footer>
<script>
/* ===================== 引擎 ===================== */
const NS='http://www.w3.org/2000/svg';
function E(tag,a,txt){const n=document.createElementNS(NS,tag);
  for(const k in a||{})n.setAttribute(k,a[k]); if(txt!=null)n.textContent=txt; return n;}
function pathd(pts){return 'M'+pts.map(p=>p[0]+','+p[1]).join(' L');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let SC=null, SCIDX=0, IDX=0, PLAYING=false, TIMER=null, DUR=1500;

// 浏览进度：这一份看到哪个场景、第几步，只存在看的人自己的浏览器里。
// 六份共用一套引擎，file:// 下可能共享同一份存储，所以 key 带上文件名。
const PKEY='bach-anim:'+decodeURIComponent(location.pathname.split('/').pop()||'');
function saveProgress(){
  try{localStorage.setItem(PKEY,JSON.stringify({sc:SCIDX,st:IDX}));}catch(e){}}
function loadProgress(){                          // 存储被禁或内容坏了都当没存过
  try{const v=JSON.parse(localStorage.getItem(PKEY)||'null');
      return v&&Number.isInteger(v.sc)&&Number.isInteger(v.st)?v:null;}catch(e){return null;}}
const stage=document.getElementById('stage');
let svg=null, nodeEls={}, edgeEls={}, cntEls={}, tokLayer=null, anims=[];

// logic 的一项是 [方向, 通道, 内容] 三元组；通道可以留空
function logicHtml(rows){
  if(typeof rows[0]==='string') return '<pre>'+esc(rows.join('\n'))+'</pre>';
  let h='<table class="lg"><tr><th>方向</th><th>通道</th><th>内容</th></tr>';
  rows.forEach(r=>{                                // 方向为空的是上一条的续行，不再画分隔线
    h+='<tr'+(r[0]?'':' class="cont"')+'><td class="d">'+esc(r[0]||'')+'</td><td class="c">'
      +esc(r[1]||'')+'</td><td>'+esc(r[2]||'')+'</td></tr>';});
  return h+'</table>';}

function build(sc){
  SC=sc; nodeEls={}; edgeEls={}; cntEls={};
  stage.innerHTML='';
  svg=E('svg',{viewBox:'0 0 '+sc.vb[0]+' '+sc.vb[1],preserveAspectRatio:'xMidYMid meet'});
  const defs=E('defs');
  const m=E('marker',{id:'ar',viewBox:'0 0 10 8',refX:9,refY:4,markerWidth:7,markerHeight:6,orient:'auto'});
  m.appendChild(E('path',{d:'M0 0 L10 4 L0 8 z',fill:'currentColor'}));
  defs.appendChild(m); svg.appendChild(defs);
  (sc.groups||[]).forEach(g=>{
    svg.appendChild(E('rect',{x:g.x,y:g.y,width:g.w,height:g.h,rx:8,class:'grp'}));
    svg.appendChild(E('text',{x:g.x+10,y:g.y+16,class:'grpl'},g.label));});
  (sc.edges||[]).forEach(e=>{
    const g=E('g',{class:'edw',color:'var(--boxb)'});
    const p=E('path',{d:pathd(e.pts),class:'ed','marker-end':'url(#ar)'});
    if(e.dash)p.setAttribute('stroke-dasharray','5 4');
    g.appendChild(p); svg.appendChild(g); edgeEls[e.id]={g:g,p:p};
    if(e.label)svg.appendChild(E('text',{x:(e.lx!=null?e.lx:e.pts[0][0]),y:(e.ly!=null?e.ly:e.pts[0][1]-5),
      class:'edl','text-anchor':'middle'},e.label));});
  (sc.nodes||[]).forEach(n=>{
    const g=E('g',{class:'nd'});
    g.appendChild(E('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:n.r!=null?n.r:5}));
    const lines=Array.isArray(n.s)?n.s:(n.s?[n.s]:[]);
    const cy=n.y+(lines.length?18:n.h/2+4);
    g.appendChild(E('text',{x:n.x+n.w/2,y:cy,'text-anchor':'middle','font-size':n.fs||11.5,class:'t'},n.t));
    lines.forEach((L,i)=>g.appendChild(E('text',{x:n.x+n.w/2,y:cy+14+i*12,'text-anchor':'middle',class:'sub'},L)));
    svg.appendChild(g); nodeEls[n.id]=g;});
  (sc.counters||[]).forEach(c=>{
    const t=E('text',{x:c.x,y:c.y,class:'cnt','text-anchor':c.anchor||'start'},c.label+' '+c.val);
    svg.appendChild(t); cntEls[c.id]={el:t,label:c.label,init:c.val};});
  tokLayer=E('g'); svg.appendChild(tokLayer); stage.appendChild(svg);
  document.getElementById('stlabel').textContent=sc.table?sc.table.label:'状态';
  IDX=0; apply(0,false);
}

function apply(i,animate){
  IDX=Math.max(0,Math.min(i,SC.steps.length-1));
  saveProgress();
  const s=SC.steps[IDX];
  anims.forEach(a=>cancelAnimationFrame(a)); anims=[]; tokLayer.innerHTML='';
  for(const k in nodeEls) nodeEls[k].setAttribute('class','nd');
  for(const k in edgeEls){edgeEls[k].p.setAttribute('class','ed'); edgeEls[k].g.setAttribute('color','var(--boxb)');}
  (s.act||[]).forEach(id=>{if(nodeEls[id])nodeEls[id].setAttribute('class','nd act');});
  (s.blk||[]).forEach(id=>{if(nodeEls[id])nodeEls[id].setAttribute('class','nd blk');});
  (s.eact||[]).forEach(id=>{if(edgeEls[id]){edgeEls[id].p.setAttribute('class','ed act');
    edgeEls[id].g.setAttribute('color','var(--accent)');}});
  const cur={},prev={};
  for(const k in cntEls){cur[k]=cntEls[k].init;prev[k]=cntEls[k].init;}
  for(let j=0;j<=IDX;j++){const st=SC.steps[j];
    if(j===IDX)for(const k in cur)prev[k]=cur[k];
    for(const k in (st.set||{})) cur[k]=st.set[k];}
  for(const k in cntEls){const c=cntEls[k];
    c.el.textContent=c.label+' '+cur[k];
    c.el.setAttribute('class','cnt'+(cur[k]!==prev[k]?' chg':''));}
  if(SC.table){
    const rows=SC.table.rows.map(r=>r.slice()); let chg=new Set();
    for(let j=0;j<=IDX;j++){const st=SC.steps[j];
      if(j===IDX)chg=new Set();
      (st.rows||[]).forEach(w=>{const ri=Array.isArray(w)?w[0]:w.i, rc=Array.isArray(w)?w[1]:w.cells;
        rows[ri]=rc.slice(); if(j===IDX)chg.add(ri);});}
    let h='<table class="st"><tr>'+SC.table.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
    rows.forEach((r,i)=>{h+='<tr'+(chg.has(i)?' class="chg"':'')+'>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
    document.getElementById('sttable').innerHTML=h+'</table>';
  } else document.getElementById('sttable').innerHTML='';
  document.getElementById('stepno').textContent='步骤 '+(IDX+1)+' / '+SC.steps.length;
  document.getElementById('steptitle').textContent=s.t;
  document.getElementById('steptext').innerHTML=Array.isArray(s.d)
    ? '<ol>'+s.d.map(x=>'<li>'+x+'</li>').join('')+'</ol>' : s.d;
  const lg=document.getElementById('steplogic');
  lg.innerHTML=(s.logic&&s.logic.length)
    ? '<h3 class="sec">'+(s.lt||'收到 → 输出')+'</h3>'+logicHtml(s.logic) : '';
  document.getElementById('stepref').innerHTML=s.ref?('<b>出处</b> '+s.ref):'';
  document.getElementById('barfill').style.width=((IDX+1)/SC.steps.length*100)+'%';
  (s.tok||[]).forEach(tk=>runTok(tk,animate));
}

function runTok(tk,animate){
  const e=edgeEls[tk.ed]; if(!e)return;
  const L=e.p.getTotalLength();
  const g=E('g'); g.appendChild(E('circle',{r:tk.r||7,fill:tk.c||'var(--accent)',class:'tok'}));
  if(tk.lbl)g.appendChild(E('text',{x:0,y:-12,'text-anchor':'middle','font-size':9.5,
     fill:tk.c||'var(--accent)','font-family':'var(--mono)','font-weight':700},tk.lbl));
  tokLayer.appendChild(g);
  const t0=performance.now(), span=DUR*0.72, delay=(tk.delay||0)*DUR*0.18;
  function frame(now){
    let u=(now-t0-delay)/span;
    if(u<0){g.setAttribute('opacity',0);anims.push(requestAnimationFrame(frame));return;}
    g.setAttribute('opacity',1); if(u>1)u=1;
    const p=e.p.getPointAtLength((tk.rev?1-u:u)*L);
    g.setAttribute('transform','translate('+p.x+','+p.y+')');
    if(u<1&&animate!==false)anims.push(requestAnimationFrame(frame));
    else if(animate===false){const q=e.p.getPointAtLength((tk.rev?0:1)*L);
      g.setAttribute('transform','translate('+q.x+','+q.y+')');}}
  anims.push(requestAnimationFrame(frame));
}

function play(){PLAYING=true;document.getElementById('play').textContent='❚❚ 暂停';tick();}
function pause(){PLAYING=false;document.getElementById('play').textContent='▶ 播放';clearTimeout(TIMER);}
function tick(){clearTimeout(TIMER);TIMER=setTimeout(()=>{
  if(!PLAYING)return;
  if(IDX>=SC.steps.length-1){apply(0,true);}else{apply(IDX+1,true);}
  tick();},DUR);}
document.getElementById('play').onclick=()=>PLAYING?pause():play();
document.getElementById('next').onclick=()=>{pause();apply(IDX+1,true);};
document.getElementById('prev').onclick=()=>{pause();apply(IDX-1,true);};
document.getElementById('spd').oninput=e=>{DUR=5000-(+e.target.value)+500;if(PLAYING)tick();};
document.getElementById('bar').onclick=e=>{pause();
  const r=e.currentTarget.getBoundingClientRect();
  apply(Math.floor((e.clientX-r.left)/r.width*SC.steps.length),true);};
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();PLAYING?pause():play();}
  if(e.key==='ArrowRight'){pause();apply(IDX+1,true);}
  if(e.key==='ArrowLeft'){pause();apply(IDX-1,true);}});




/* ================================================================
   公共布局
   平面一：一条 path 上的三跳，本 core 居中
   平面二：Router 八个模块（左中列）与 core 内对手方（右列）
   纵向通道：186～216 · 346～376 · 572～620 · 806～840
   ================================================================ */

/* ---- 平面一：path 上的三跳 ---- */
function pathNodes(){
  return [
   {id:'up',  x:70, y:58, w:210,h:54,fs:11,t:'上游 core',s:['发出这一份分量']},
   {id:'me',  x:415,y:58, w:210,h:54,fs:11,t:'本 core',s:['中继累加']},
   {id:'dn',  x:760,y:58, w:210,h:54,fs:11,t:'下游 core',s:['继续往下累加']},
   {id:'lo',  x:415,y:136,w:210,h:34,fs:10,t:'本 core 的 DTE：出核那一份分量'}];
}
function pathEdges(){
  return [
   {id:'p_up',pts:[[280,85],[415,85]],label:'left　256 B/T',lx:348,ly:79},
   {id:'p_dn',pts:[[625,85],[760,85]],label:'right　256 B/T',lx:693,ly:79},
   {id:'p_lo',pts:[[520,136],[520,112]],label:'local',lx:552,ly:128}];
}

/* ---- 平面二：Router 内部与 core 内对手方 ----
   布局照 03-router-片上交换与归约.md 主图，也就是 MAS 的 Block Diagram：
   5×7 CrossBar 居中，三个 RouterStation 各接一个方向（left 展开画，right / mid 同构），
   CoreStation 在上，ReduceModule 在右下；core 内的对手方排在最上一行
   ---- */
const RT_NODES=[
 {id:'ts',  x:40, y:206,w:160,h:40,fs:10.5,t:'TS',s:['MAS 记作 TaskScheduler']},
 {id:'drv', x:212,y:206,w:148,h:40,fs:10.5,t:'DTE RV Core',s:['MAS 记作 DTE Core']},
 {id:'dte', x:372,y:206,w:148,h:40,fs:10.5,t:'DTE DSA',s:['DataIn / DataOut']},
 {id:'cm',  x:532,y:206,w:128,h:40,fs:10.5,t:'Core Mem'},
 {id:'cmcm',x:40, y:262,w:190,h:88,fs:10,  t:'CoreMemCreditMonitor',
  s:['MAS 图上并作 Stream Resource Map','本级 stream credit 表，唯一有效状态','出核前的资源监听，队列 16 项全相连']},
 {id:'cs',  x:300,y:262,w:320,h:88,fs:11,  t:'CoreStation',
  s:['Header FIFO · in_core_fifo · Arbiter','三态准入 · Header 就绪 → trigger TS','Packet Join / Split：进核拼包，出核拆包']},
 {id:'rtab',x:690,y:262,w:310,h:88,fs:11,  t:'CSR / RouterTable',
  s:['64 条，索引 path_id，内部多副本','Credit 静态 Mask · perf & debug','只描述静态路由与资源需求']},
 {id:'rs_l',x:40, y:368,w:240,h:102,fs:11, t:'RouterStation[left]',
  s:['Header Check + RouterTable 副本','allocate → VC0～3 → Arbiter','VC Credit · Stream 映射 · Credit Release','output buffer + Packet Shifter']},
 {id:'xb',  x:380,y:368,w:180,h:72,fs:11,  t:'Xbar',
  s:['MAS 记作 CrossBar / Interconnect Matrix','5 入 7 出，按输出独立仲裁','无冲突同拍并行，多播全有或全无']},
 {id:'rs_r',x:660,y:368,w:200,h:72,fs:11,  t:'RouterStation[right]',
  s:['结构同 left','行两端这一侧接 C2C Bridge']},
 {id:'rs_m',x:320,y:462,w:240,h:66,fs:11,  t:'RouterStation[mid]',
  s:['结构同 left','接另一行对称位的 Router']},
 {id:'rmod',x:660,y:462,w:340,h:110,fs:11, t:'ReduceModule',
  s:['ReduceMemory 32 KiB × 16 用户 · Adder + Convert','RMW 原位累加，中间 FP32','CreditBypass XBar · ResourceMap（相邻下游）']},
 {id:'reis',x:40, y:496,w:240,h:76,fs:10.5,t:'CoreMem 重发',
  s:['stall_way 转存时走这里','Bypass 拆成进 core 加出 core','同 VC 保序，不许超车']},
 {id:'ret', x:320,y:544,w:240,h:56,fs:10.5,t:'Retire',
  s:['停发该 UserID · 删 Stream 授权','credit 经 crossbar 逐跳回上游']}];

const SCENES=[S_TOPO,S_TASK,S_RUN,S_MODS];
const nav=document.getElementById('nav');
SCENES.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.name;
  b.onclick=()=>{pause();[...nav.children].forEach(x=>x.classList.remove('on'));
    b.classList.add('on');SCIDX=i;build(s);};nav.appendChild(b);});

// 回到上次看到的地方；存的场景或步骤已经不存在了就从头开始
const PROG=loadProgress();
const PVALID=!!PROG&&PROG.sc>=0&&PROG.sc<SCENES.length;   // 场景对不上就整条作废，步数不挪用到别的场景
SCIDX=PVALID?PROG.sc:0;
nav.children[SCIDX].classList.add('on');
build(SCENES[SCIDX]);
if(PVALID&&PROG.st>0&&PROG.st<SCENES[SCIDX].steps.length) apply(PROG.st,false);
